# Pages CMS configuration — DRAFT, not yet validated against a live Pages CMS install.
# Labels are in Russian because Natasha edits in Russian; field names stay English for build.py.
# Syntax per pagescms.org/docs (fields, list, select, image, media, operations, filename).

settings:
  commit:
    identity: user          # commits show who edited (Natasha / Marina)

media:
  input: media
  output: /media
  rename: true
  extensions: [jpg, jpeg, png, webp]

content:
  # ---------------- Литература ----------------
  - name: literature-about
    label: "Литература — Обо мне"
    type: file
    path: content/literature-about.md
    format: yaml-frontmatter
    fields:
      - { name: heading, label: "Имя (заголовок)", type: string, required: true }
      - { name: role, label: "Подпись рядом с именем", type: string, description: "Напр.: Writer & Poet" }
      - { name: portrait, label: "Портрет", type: image }
      - { name: image_bw, label: "Портрет чёрно-белый", type: boolean, default: true, description: "Включено — портрет на странице «Литература» в ч/б. Выключи — в цвете" }
      - { name: image_credit, label: "Автор фото", type: string, description: "Кто сделал фото — появится мелко под фото как «Photo: …». Можно оставить пустым" }
      - { name: body, label: "Текст био", type: text, required: true, description: "3-е лицо, 5–10 предложений. Курсив: *название*" }

  - name: books
    label: "Литература — Книги"
    type: file
    path: content/books.yml
    format: yaml
    fields:
      - name: books
        label: "Книги (порядок в списке = порядок на сайте)"
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.title}" } }
        fields:
          - { name: title, label: "Название", type: string, required: true }
          - { name: kind, label: "Жанр / роль", type: string, description: "Напр.: Poetry; Essays — editor, co-author" }
          - { name: publisher, label: "Издательство", type: string }
          - { name: year, label: "Год", type: number }
          - { name: prize, label: "Премия (если есть)", type: string }
          - { name: cover, label: "Обложка", type: image }
          - { name: description, label: "Описание книги", type: text, description: "Показывается на странице книги справа от обложки. Новый абзац — пустая строка" }
          - { name: link, label: "Ссылка (необязательно)", type: string, description: "Адрес страницы с публикацией (https://…). Строка станет кликабельной и откроется в новой вкладке. Одна ссылка на строку — если изданий несколько, сделай отдельные строки" }
          - { name: coming_soon, label: "Скоро (Coming soon)", type: boolean, default: false, description: "Карточка «Coming soon» без отдельной страницы. Можно оставить пустой или добавить название/обложку будущей книги" }
          - { name: show, label: "Показывать на сайте", type: boolean, default: true }

  - name: published
    label: "Литература — Публикации"
    type: file
    path: content/published.yml
    format: yaml
    fields:
      - name: groups
        label: "Разделы"
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.heading}" } }
        fields:
          - { name: heading, label: "Название раздела", type: string, required: true }
          - name: items
            label: "Публикации"
            type: object
            list: { collapsible: { collapsed: true, summary: "{fields.text}" } }
            fields:
              - { name: text, label: "Текст строки", type: string, required: true, description: "Издание — что, год" }
              - { name: link, label: "Ссылка (необязательно)", type: string }
              - { name: show, label: "Показывать на сайте", type: boolean, default: true }

  - name: news
    label: "Литература — Новости"
    type: collection
    path: content/news
    format: yaml-frontmatter
    filename: "{fields.date}-{primary}.md"
    view: { fields: [title, date], sort: [date], default: { sort: date, order: desc } }
    fields:
      - { name: title, label: "Заголовок", type: string, required: true }
      - { name: date, label: "Дата", type: date, required: true, description: "Можно в прошлом. Если не помнишь день — поставь 1-е число и выбери точность ниже" }
      - name: date_precision
        label: "Показывать дату как"
        type: select
        default: day
        options:
          values:
            - { name: day, label: "день месяц год" }
            - { name: month, label: "месяц год" }
            - { name: year, label: "только год" }
      - { name: body, label: "Текст новости", type: text, description: "1–3 предложения (можно оставить пустым)" }
      # ---- картинка: выбирает Наташа, не зависит от ссылок ----
      - { name: image, label: "Картинка", type: image, description: "Загрузи файл или выбери уже загруженный. Любое фото — не обязательно из статьи по ссылке. Если пусто — обложка связанной книги" }
      - { name: image_url, label: "…или картинка по ссылке", type: string, description: "Только если не загружаешь файл: адрес картинки (https://…jpg). Ссылки с Facebook через несколько дней перестают работать — лучше скачать и загрузить файлом" }
      - { name: image_credit, label: "Автор фото", type: string, description: "Если фото не твоё: напр. «Vísir / Vilhelm». Будет подпись под фото" }
      - name: image_fit
        label: "Как показать картинку"
        type: select
        default: cover
        options: { values: [ { name: cover, label: "заполнить карточку (обрезать края)" }, { name: contain, label: "целиком (для вырезок и текста)" } ] }
      - { name: hold_image, label: "Пока не показывать картинку", type: boolean, default: false, description: "Включи, если ждёшь разрешения автора фото. Вместо неё будет обложка книги" }
      - name: book
        label: "Связанная книга (необязательно)"
        type: select
        description: "Если картинки нет — на карточке будет обложка этой книги"
        options:
          values: ["Mara kemur í heimsókn", "Skáldreki // Writers adrift", "Máltaka á stríðstímum", "Polífonía af erlendum uppruna", "Магма / Kvika", "Одной цепью"]
      # ---- текст и ссылки ----
      - { name: excerpt, label: "Цитата из статьи (необязательно)", type: text, description: "1–2 предложения из начала статьи, дословно — покажется курсивом в кавычках" }
      - { name: excerpt_source, label: "Источник цитаты", type: string, description: "Напр. RÚV, Vísir" }
      - name: links
        label: "Ссылки — пресса, видео, интервью"
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.source}" } }
        description: "Сколько угодно. Название источника видно на сайте, напр. RÚV, Vísir, Grapevine"
        fields:
          - { name: source, label: "Источник", type: string, required: true }
          - { name: url, label: "Адрес (URL)", type: string, required: true }
      - { name: pin, label: "Главная новость года", type: boolean, default: false, description: "Встаёт первой в своём году и получает обложку книги" }
      - { name: show, label: "Показывать на сайте", type: boolean, default: true }

  # ---------------- Фотография ----------------
  - name: photography-about
    label: "Фотография — Обо мне"
    type: file
    path: content/photography-about.md
    format: yaml-frontmatter
    fields:
      - { name: heading, label: "Имя (заголовок)", type: string, required: true }
      - { name: role, label: "Подпись рядом с именем", type: string, description: "Напр.: Photographer" }
      - { name: image, label: "Фото рядом с текстом (необязательно)", type: image }
      - { name: image_bw, label: "Фото чёрно-белое", type: boolean, default: true, description: "Включено — фото рядом с текстом на странице «Фотография» в ч/б. Выключи — в цвете" }
      - { name: image_credit, label: "Автор фото", type: string, description: "Кто сделал фото — появится мелко под фото как «Photo: …». Можно оставить пустым" }
      - { name: body, label: "Текст", type: text, required: true, description: "3–5 строк" }

  - name: galleries
    label: "Фотография — Галереи"
    type: collection
    path: content/galleries
    format: yaml-frontmatter
    filename: "{primary}.md"
    view: { fields: [title, order] }
    fields:
      - { name: title, label: "Название категории", type: string, required: true, description: "Напр.: Events. Из названия получается адрес страницы — менять потом не нужно" }
      - { name: order, label: "Порядок на странице «Photography» (1 = первая)", type: number }
      - { name: description, label: "Подзаголовок (необязательно)", type: text }
      - name: rows
        label: "Ряды галереи (сверху вниз)"
        type: object
        list: { collapsible: { collapsed: true, summary: "{fields.layout}" } }
        description: "Галерея собирается из рядов. Первый ряд — тип А: его фото ① (широкое) — главное фото категории, оно же обложка на странице «Photography». Дальше узор: Б, В, Г, потом снова А, Б, В, Г…"
        fields:
          - name: layout
            label: "Тип ряда"
            type: select
            required: true
            default: "А · 2 фото"
            options:
              values:
                - { name: "А · 2 фото", label: "А — 2 фото: ① горизонтальное (широкое, слева) ② вертикальное (узкое, справа)" }
                - { name: "Б · 5 фото", label: "Б — 5 фото: ①② слева друг над другом · ③ высокое в центре · ④⑤ справа друг над другом" }
                - { name: "В · 2 фото", label: "В — 2 фото: ① вертикальное (узкое, слева) ② горизонтальное (широкое, справа)" }
                - { name: "Г · 4 фото", label: "Г — 4 фото: ① высокое слева · ②③ в центре друг над другом · ④ высокое справа" }
          - name: photos
            label: "Фото ряда (по порядку ①②③…)"
            type: object
            list: { collapsible: { collapsed: true } }
            description: "Сколько фото в ряду: А — 2, Б — 5, В — 2, Г — 4. Лишние не покажутся. Номер в списке = номер места в схеме"
            fields:
              - { name: image, label: "Фото", type: image, required: true, description: "~2500 px, JPG. Для «высоких» и «вертикальных» мест — вертикальное фото" }
      - { name: show, label: "Показывать на сайте", type: boolean, default: true }

  # ---------------- Общее ----------------
  - name: site
    label: "Главная страница и контакты"
    type: file
    path: content/site.yml
    format: yaml
    fields:
      - { name: name, label: "Имя на сайте", type: string, required: true }
      - { name: email, label: "E-mail", type: string, required: true }
      - { name: location, label: "Город", type: string }
      - { name: facebook, label: "Facebook (ссылка)", type: string, description: "Значок в правом верхнем углу сайта. Пусто — значка нет" }
      - { name: instagram, label: "Instagram (ссылка)", type: string, description: "Значок в правом верхнем углу сайта. Пусто — значка нет" }
      - { name: languages, label: "Языки", type: string }
      - { name: entrance_literature_image, label: "Главная: фото слева («Литература»)", type: image, description: "Большая картинка левой половины первой страницы. Нажми на картинку → загрузи новую → Save. Лучше вертикальная, от 2000 px" }
      - { name: literature_bw, label: "Главная слева: чёрно-белое", type: boolean, default: true, description: "Левое фото («Литература»): включено — ч/б, выключено — цвет" }
      - { name: literature_blur, label: "Главная слева: размыть", type: boolean, default: false, description: "Левое фото («Литература»): включено — мягко размыто, выключено — чётко" }
      - { name: entrance_photography_image, label: "Главная: фото справа («Фотография»)", type: image, description: "Большая картинка правой половины первой страницы. Нажми на картинку → загрузи новую → Save. Лучше вертикальная, от 2000 px" }
      - { name: photography_bw, label: "Главная справа: чёрно-белое", type: boolean, default: true, description: "Правое фото («Фотография»): включено — ч/б, выключено — цвет" }
      - { name: photography_blur, label: "Главная справа: размыть", type: boolean, default: false, description: "Правое фото («Фотография»): включено — мягко размыто, выключено — чётко" }
      - { name: entrance_literature_subtitle, label: "Главная: подпись под «Литература»", type: string }
      - { name: entrance_photography_subtitle, label: "Главная: подпись под «Фотография»", type: string }
