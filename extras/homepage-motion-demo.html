<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Natasha S. — homepage motion (demo)</title>
<link rel="stylesheet" href="static/style.css">
<style>
/* 1 · slow "breathing" zoom — the two photos run out of step */
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.18)}}
@keyframes breathe-blur{from{transform:scale(1.06)}to{transform:scale(1.24)}}
.gate .half img{animation:breathe 12s ease-in-out infinite alternate;will-change:transform}
.gate .half.blur img{animation-name:breathe-blur}
.gate .half.pho img{animation-delay:-6s}
/* phones/computers set to "reduce motion" get the still page */
@media(prefers-reduced-motion:reduce){.gate .half img{animation:none}.gate a.half{transition:none}}
.demotag{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(20,17,15,.86);color:#f6f5f2;font:11px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:.08em;text-align:center;padding:7px 12px}
.demotag a{color:inherit}
</style>
</head><body>
<div class="gate">
  <h1 class="sr-only">Natasha S. — ljóð, myndir</h1>
  <div class="gatelogo" aria-hidden="true">
    <div class="l"><span class="nm">Natasha S.</span><span class="a">Ljóð</span></div>
    <div class="r"><span class="b">myndir</span></div>
  </div>
  <a class="half lit" href="literature.html">
    <img src="media/w1400/natasha-portrait.jpg" alt="">
    <div class="label"><h2>Literature</h2><div class="sub sans">Poetry · essays · translation</div></div>
  </a>
  <a class="half pho" href="photography.html">
    <img src="media/w1400/cover1.jpg" alt="">
    <div class="label"><h2>Photography</h2><div class="sub sans">Family · events · documentary · fine art</div></div>
  </a>
</div>
<div class="demotag">DEMO · option 1: slow zoom · <a href="homepage-opening-demo.html">option 2: short opening</a> · <a href="index.html">current homepage</a></div>
</body></html>
